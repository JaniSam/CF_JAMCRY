    <!-- CONTENIDO PRINCIPAL -->
    <div class="container py-5">

        <h1 class="text-center fw-bold mb-4">CONTÁCTANOS</h1>

        <div class="row g-4">

            <!-- TARJETA DE INFORMACIÓN -->
            <div class="col-12 col-lg-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h3 class="fw-bold mb-3 text-center">Información</h3>

                        <p class="fs-5"><strong>Email:</strong> grupo.jamcry@gmail.com</p>
                        <p class="fs-5"><strong>Teléfono:</strong> +595 991 123 456</p>

                        <div class="d-flex align-items-center mt-3">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"

                        <form>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre</label>

                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Correo electrónico</label>
                                <input type="email" class="form-control" placeholder="nombre@ejemplo.com">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Mensaje</label>
                                <textarea class="form-control" rows="5" placeholder="Escribe tu consulta aquí..."></textarea>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-dark px-4 fs-5">Enviar</button>
                            </div>
                        </form>

                    </div>
                </div>
